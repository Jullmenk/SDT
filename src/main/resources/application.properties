# =============================================================================
# CONFIGURACAO DO SISTEMA DISTRIBUIDO IPFS + FAISS
# =============================================================================
# Ao contrario da versao anterior deste ficheiro, TODOS os valores abaixo sao
# efetivamente lidos pelo codigo, atraves da classe common.Config (ver Config.java).
# Antes este ficheiro existia mas nao era lido em lado nenhum - tudo estava
# "hardcoded" nas classes Lider/Peer. A seccao de multicast foi removida porque nunca
# chegou a ser usada (o sistema usa o PubSub nativo do IPFS para toda a comunicacao,
# conforme a nota do enunciado do Sprint 1: "o libp2p ja faz parte do IPFS").

# -----------------------------------------------------------------------------
# IPFS
# -----------------------------------------------------------------------------
# O IPFS daemon deve estar a correr em cada maquina antes de iniciar Lider/Peer.
ipfs.host=127.0.0.1
ipfs.port=5001

# Topico PubSub usado para toda a comunicacao entre lider e peers (PREPARE, COMMIT,
# CONFIRMACAO, heartbeat, eleicao, peer_hello, query, query_result).
pubsub.topic=atualizacoes

# -----------------------------------------------------------------------------
# LIDER
# -----------------------------------------------------------------------------
# Porta onde a API REST do Lider corre (clientes enviam ficheiros para /upload aqui).
lider.api.port=8080

# -----------------------------------------------------------------------------
# PEER
# -----------------------------------------------------------------------------
# Porta da API de debug do peer (/health, /estado, /pesquisas/:id) - nao faz parte do
# fluxo normal do RF1/RF2, e so para inspecao manual durante os testes.
peer.faiss.proxy.port=8090

# -----------------------------------------------------------------------------
# SERVICO FAISS (faiss_service.py)
# -----------------------------------------------------------------------------
# IMPORTANTE: cada peer corre a SUA PROPRIA instancia local do faiss_service.py.
# Nao e um servico central partilhado - ver comentario no topo de faiss_service.py.
faiss.host=localhost
faiss.port=9000
faiss.timeout.connect.ms=3000
faiss.timeout.read.ms=5000

# Dimensao dos embeddings gerados por common.EmbeddingUtil - tem de ser igual ao DIM
# usado em faiss_service.py (variavel de ambiente EMBEDDINGS_DIM).
embeddings.dim=128

# -----------------------------------------------------------------------------
# CONSENSO (RF1) E PINNING
# -----------------------------------------------------------------------------
# Numero minimo de peers que devem fazer pinning de cada ficheiro/embedding (regra
# explicita do RF1: "pelo menos 2 peers").
pinning.replicas=2

# -----------------------------------------------------------------------------
# DETECAO DE FALHA E ELEICAO (RNF3 / RNF4)
# -----------------------------------------------------------------------------
# Intervalo entre heartbeats do lider (tambem usado para o anuncio periodico "peer_hello").
heartbeat.interval.ms=5000

# Tempo sem heartbeat a partir do qual um peer assume que o lider falhou.
heartbeat.timeout.ms=10000

# Duracao da janela de eleicao (tempo de espera por mensagens "election" de outros peers
# antes de decidir quem venceu).
eleicao.duracao.ms=3000

# -----------------------------------------------------------------------------
# NOTAS IMPORTANTES
# -----------------------------------------------------------------------------
# 1. Cada maquina (peer ou lider) usa este mesmo ficheiro, mas o IPFS local de cada
#    uma tem de estar a correr em ipfs.host:ipfs.port ANTES de arrancar o Lider/Peer.
# 2. O IP publico do lider nao e gerido por este ficheiro: o cliente aponta diretamente
#    para o IP/porta onde o processo Lider estiver a correr (ver README.md, seccao
#    "Limitacoes conhecidas" - a eleicao ainda nao e 100% transparente para o cliente).
# 3. Firewall: a porta lider.api.port deve estar aberta na maquina do lider.
# =============================================================================
